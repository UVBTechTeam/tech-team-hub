function authGate(){firebase.initializeApp(FIREBASE_CONFIG);const a=firebase.auth();return new Promise(res=>{a.onAuthStateChanged(u=>{if(u){const l=document.getElementById('login');if(l)l.remove();res(u)}else showLogin(a)})})}
function showLogin(a){if(document.getElementById('login'))return;const d=document.createElement('div');d.id='login';d.className='ov';d.style.alignItems='center';d.innerHTML='<div class="md" style="max-width:380px"><div class="brand" style="margin-bottom:14px"><span class="badge">UVB</span><h1 style="font-size:26px">Tech Team Hub</h1></div><form id="lf2"><label>Email</label><input id="em" type="email" autocomplete="username" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" required><p class="err" id="le"></p><button class="p" type="submit" style="width:100%">Sign in</button></form><p class="mu" style="margin-top:12px"><a href="#" id="fp">Forgot password?</a></p></div>';document.body.append(d);
const er=m=>d.querySelector('#le').textContent=m;
d.querySelector('#lf2').onsubmit=async e=>{e.preventDefault();er('');try{await a.signInWithEmailAndPassword(d.querySelector('#em').value.trim(),d.querySelector('#pw').value)}catch(x){er('Sign-in failed. Check your email and password.')}};
d.querySelector('#fp').onclick=async e=>{e.preventDefault();const m=d.querySelector('#em').value.trim();if(!m)return er('Enter your email first, then click Forgot password.');try{await a.sendPasswordResetEmail(m);er('Password reset email sent.')}catch(x){er('Could not send reset email.')}}}
function fbAdapter(){const r=firebase.database(),cl=d=>JSON.parse(JSON.stringify(d));
const snap=v=>{const o=v||{};return{docs:Object.keys(o).map(k=>({id:k,data:()=>o[k]}))}};
return{collection:n=>({onSnapshot:(cb,er)=>r.ref(n).on('value',x=>cb(snap(x.val())),e=>er&&er(e)),add:d=>r.ref(n).push(cl(d)),doc:id=>({set:d=>r.ref(n+'/'+id).set(cl(d)),delete:()=>r.ref(n+'/'+id).remove()})})}}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L='Europe/London',today=()=>new Date().toLocaleDateString('en-CA',{timeZone:L}),nowT=()=>new Date().toLocaleTimeString('en-GB',{timeZone:L,hour:'2-digit',minute:'2-digit',hour12:false});
const addD=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fmtD=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'';
const dow=d=>(new Date(d+'T12:00:00Z').getUTCDay()+6)%7;
let db=null,S={events:[],tasks:[],moves:[],ann:'',hist:[],tpl:[],handover:[]},cal={v:'month',d:today(),room:''},showDone=false,F={ev:{q:'',f:'all',room:''},tk:{q:'',f:'out'},mv:{q:'',type:'',st:'',range:'all'}},toast='';
const col=n=>db.collection(n);
function say(m){toast=m;const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;z-index:99';document.body.append(t);setTimeout(()=>t.remove(),2200)}
async function save(c,id,o,msg,base){const cur=(S[c]||[]).find(x=>x.id===id);
if(cur&&base!==undefined&&(cur.rev||0)!==(base||0)&&!await ask('Someone else changed this record while you were editing. Overwrite their changes?','Overwrite'))return false;
try{o.rev=Date.now();await col(c).doc(id).set(o);log(c,id,o,cur?'edited':'created');if(c==='events')markSeen(id,o.rev);say(msg||'Saved');return true}catch(e){say('Save failed: '+(e.message||e.code));return false}}
function ask(m,ok){return new Promise(r=>{const o=document.createElement('div');o.className='ov';o.style.zIndex=99;o.innerHTML='<div class="md"><p>'+esc(m)+'</p><button class="p" id="y">'+(ok||'Delete')+'</button> <button id="n">Cancel</button></div>';document.body.append(o);o.querySelector('#y').onclick=()=>{o.remove();r(true)};o.querySelector('#n').onclick=()=>{o.remove();r(false)}})}
async function del(c,id,what){if(!await ask('Delete this '+what+'? This cannot be undone.'))return false;try{const cur=(S[c]||[]).find(x=>x.id===id);await col(c).doc(id).delete();if(cur)log(c,id,cur,'deleted');say('Deleted');return true}catch(e){say('Delete failed');return false}}
const uid=()=>crypto.randomUUID().slice(0,12);
const STAFF=['Jabari Douglas','Matt Spiers','Alastair Willimott','Levi Simpson','Tori Bukle','Jamie Dickinson','Anders Berry','Jake Cureton','Freelancer'],ROLES=['Duty Technician','Production Manager','Production Assistant','Lighting Engineer','Sound Engineer','Graphics Technician','Audio No. 2','Crew','General Technician'];
const stRow=(n='',r='')=>`<div class="ts"><input list="sn" placeholder="Name" value="${esc(n)}" style="width:auto;flex:1"><input list="sr" placeholder="Role" value="${esc(r)}" style="width:auto;flex:1"><button type="button" class="d" onclick="this.parentNode.remove()">✕</button></div>`;
const stTxt=e=>(e.staff||[]).map(x=>esc(x.n)+(x.r?' ('+esc(x.r)+')':'')).join(', ');
let lastVisit=Date.now(),seen={};try{lastVisit=+localStorage.getItem('uvbLast')||Date.now();seen=JSON.parse(localStorage.getItem('uvbSeen')||'{}')}catch(e){}
const stamp=()=>{try{localStorage.setItem('uvbLast',Date.now())}catch(e){}};setInterval(stamp,30000);addEventListener('pagehide',stamp);stamp();
const upd=e=>e.rev&&e.rev>lastVisit&&e.rev>(seen[e.id]||0);
function markSeen(id,rev){seen[id]=rev;try{localStorage.setItem('uvbSeen',JSON.stringify(seen))}catch(e){}}
const NU=()=>evs().filter(e=>e.date>=today()&&upd(e)).length;
function chg(){const u=evs().filter(e=>e.date>=today()&&upd(e));return u.length?`<div class="ban" style="border-left-color:var(--teal);color:var(--teal);background:#122622;border-color:#245a50"><span>🔔 ${u.length} upcoming event${u.length>1?'s':''} changed since you last looked: ${u.map(e=>`<a href="#/event/${e.id}">${esc(e.name)}${e.flag?' ⚠':''}</a>`).join(', ')}</span></div>`:''}
function hoCard(){const td=today(),now=S.handover.find(h=>h.date===td),prev=[...S.handover].filter(h=>h.date<td).sort((a,b)=>b.date.localeCompare(a.date))[0];return `<div class="card"><h2><span>Handover notes</span></h2>${prev?`<div class="mu">From ${fmtD(prev.date)} · ${esc(prev.by)}</div><pre>${esc(prev.text)}</pre><hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">`:''}<div class="mu">Today${now?' · '+esc(now.by):''}</div>${now?`<pre>${esc(now.text)}</pre>`:'<p class="mu">No handover note yet.</p>'}<button onclick="hoForm()">${now?'Edit':'Write'} today's handover</button></div>`}
function hoForm(){const td=today(),h=S.handover.find(x=>x.date===td);modal(`<h2>Handover note — ${fmtD(td)}</h2>${ta('t','What does the next shift need to know?',h&&h.text,6)}`,async f=>{const t=f.get('t').trim();if(!t)return fail('Write a note first.');return save('handover',td,{id:td,date:td,text:t,by:me||'Someone'},undefined,h?h.rev:undefined)})}
const ROOMS=['The House','The Studio','The Door','The Meeting Rooms','Meeting Room 1 & 2','Meeting Room 2 & 3','Meeting Room 1','Meeting Room 2','Meeting Room 3','LOB 101','LOB 102','LOB 103','LOB 105','Library Mezzanine','Book Rotunda','Level 2 Feature Space'];
let me='';try{me=localStorage.getItem('uvbName')||''}catch(e){}
const ttl=o=>o.title||o.name||o.supplier||o.date||'';
function log(c,id,o,a){try{col('history').add({t:Date.now(),by:me||'Someone',c,id,n:ttl(o),a})}catch(e){}}
function ask(m,ok){return new Promise(r=>{const o=document.createElement('div');o.className='ov';o.style.zIndex=99;o.innerHTML='<div class="md"><p>'+esc(m)+'</p><button class="p" id="y">'+(ok||'Delete')+'</button> <button id="n">Cancel</button></div>';document.body.append(o);o.querySelector('#y').onclick=()=>{o.remove();r(true)};o.querySelector('#n').onclick=()=>{o.remove();r(false)}})}
const TPL=[{name:'Boardroom',kit:'1 × 65-inch display\n1 × presentation laptop\n2 × handheld microphones\nHDMI and USB-C adaptors'},{name:'Conference',kit:'2 × 65-inch displays\n1 × presentation laptop\n1 × lectern microphone\n2 × handheld microphones\n1 × PA system\nHDMI and USB-C adaptors'},{name:'Hybrid meeting',kit:'1 × display\n1 × conference camera\n1 × speakerphone\n1 × laptop\nHDMI and USB-C adaptors'}];
function tplPick(s){const t=[...TPL,...S.tpl].find(x=>x.name===s.value);if(t)document.querySelector('[name=kit]').value=t.kit}
async function tplSave(){const n=document.querySelector('[name=tplname]').value.trim(),k=document.querySelector('[name=kit]').value;if(!n||!k)return say('Enter a template name and a kit list');try{await col('templates').doc(uid()).set({name:n,kit:k});say('Template saved')}catch(e){say('Could not save template')}}
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r({name:f.name,type:f.type,data:x.result});x.readAsDataURL(f)});
async function saveEv(rec,id,rep,until,base){const ok=await save('events',rec.id,rec,undefined,id?base:undefined);if(!ok)return false;
if(!id&&rep&&until){const st=rep==='w'?7:14;let d=addD(rec.date,st),n=0;while(d<=until&&n<52){const nid=uid();await save('events',nid,{...rec,id:nid,date:d});d=addD(d,st);n++}say('Created '+(n+1)+' events')}return true}
function histView(){return `<div class="card"><h2>Recent changes</h2>${[...S.hist].sort((a,b)=>b.t-a.t).slice(0,100).map(h=>`<div class="row"><span class="dot"></span><div class="g"><b>${esc(h.n)}</b> <span class="tag">${esc(h.c)}</span> ${esc(h.a)}<div class="mu">${esc(h.by)} · ${new Date(h.t).toLocaleString('en-GB',{timeZone:L})}</div></div></div>`).join('')||'<p class="mu">No changes yet.</p>'}</div>`}
function printView(){const td=today();return `<div class="bar"><button class="p" onclick="window.print()">Print</button><a href="#/">← Back</a></div><div class="card"><h2>Daily schedule — ${fmtD(td)}</h2><h3>Events</h3>${evs().filter(e=>e.date===td).map(e=>`<p><b>${first(e)!='99:99'?first(e)+' ':''}${esc(e.name)}</b> — ${esc(e.room)} ${e.flag?'⚠ FLAGGED '+esc(e.flagReason||''):''}<br>${sortT(e.timings).map(t=>t.t+' '+esc(t.a)).join(' · ')}${(e.staff||[]).length?'<br>Staff: '+stTxt(e):''}</p>`).join('')||'<p>None.</p>'}<h3>Deliveries &amp; collections</h3>${S.moves.filter(m=>m.date===td&&m.status!=='Cancelled').sort((a,b)=>a.time.localeCompare(b.time)).map(m=>`<p><b>${m.time}</b> ${esc(m.supplier)} (${m.type}) — ${m.bay?'Loading bay available':'No loading bay'}${!m.destNA&&m.dest?' → '+esc(m.dest):''}</p>`).join('')||'<p>None.</p>'}<h3>Open tasks</h3>${S.tasks.filter(t=>t.status!=='done').sort(taskSort).map(t=>`<p>☐ <b>${esc(t.title)}</b> ${t.date?'(due '+t.date+' '+(t.time||'')+')':''} [${t.pri}]</p>`).join('')||'<p>None.</p>'}</div>`}
function tick(){const n=new Date();$('#tm').textContent=nowT();$('#dt').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:L})}
setInterval(()=>{tick();if(!document.querySelector('.ov')&&!/input|textarea|select/i.test(document.activeElement.tagName)&&nowT().endsWith('0'))render()},30000);tick();
const evs=()=>[...S.events].sort((a,b)=>(a.date+first(a)).localeCompare(b.date+first(b)));
const sortT=a=>[...(a||[])].sort((x,y)=>x.t.localeCompare(y.t));
const first=e=>(e.timings||[]).map(t=>t.t).sort()[0]||'99:99',last=e=>(e.timings||[]).map(t=>t.t).sort().pop()||'';
const flagTag='<span class="tag r">⚠ FLAGGED</span>';
function evRow(e,showDate){return `<div class="row ${e.flag?'flag':''}"><span class="dot ${e.flag?'r':''}"></span><div class="g"><a href="#/event/${e.id}"><b>${esc(e.name)}</b></a> ${e.flag?flagTag:''} ${upd(e)?'<span class="tag a">UPDATED</span>':''}<div class="mu">${esc(e.room)}${showDate?' · '+fmtD(e.date):''}${first(e)!='99:99'?' · '+first(e)+(last(e)!=first(e)?'–'+last(e):''):''}</div>${e.flag&&e.flagReason?`<div>${esc(e.flagReason)}</div>`:''}${(e.staff||[]).length?`<div class="mu">👤 ${stTxt(e)}</div>`:''}</div></div>`}
function taskDue(t){return t.date?t.date+' '+(t.time||'23:59'):''}
const overdue=t=>t.status!=='done'&&t.date&&taskDue(t)<today()+' '+nowT();
const pr={Urgent:0,Important:1,Normal:2};
function taskSort(a,b){return (overdue(b)-overdue(a))||(pr[a.pri]-pr[b.pri])||((taskDue(a)||'9').localeCompare(taskDue(b)||'9'))}
function taskRow(t){const od=overdue(t),dt=t.date===today()&&t.status!=='done';return `<div class="row ${od?'od':''}"><input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleT('${t.id}',this.checked)" aria-label="Complete"><div class="g"><details><summary class="${t.status==='done'?'done':''}"><b>${esc(t.title)}</b> ${t.notes?'📝':''}</summary>${t.notes?`<pre>${esc(t.notes)}</pre>`:''}<button onclick="taskForm('${t.id}')">Edit</button> <button class="d" onclick="del('tasks','${t.id}','task')">Delete</button></details><div class="mu">${t.date?fmtD(t.date)+(t.time?' '+t.time:''):'No deadline'} ${od?'<span class="tag r">OVERDUE</span>':dt?'<span class="tag a">DUE TODAY</span>':''} <span class="tag ${t.pri==='Urgent'?'r':t.pri==='Important'?'a':''}">${t.pri}</span></div></div></div>`}
function toggleT(id,v){const t=S.tasks.find(x=>x.id===id);save('tasks',id,{...t,status:v?'done':'out'},v?'Completed':'Reopened')}
const mOver=m=>m.status==='Upcoming'&&m.date+' '+m.time<today()+' '+nowT();
function mvRow(m,full){const od=mOver(m);return `<div class="row ${od?'od':''}"><span class="dot ${od?'r':m.status==='Upcoming'?'a':''}"></span><b>${m.time}</b><div class="g"><b>${esc(m.supplier)}</b> <span class="tag ${m.type==='Delivery'?'g':'a'}">${m.type}</span>${od?' <span class="tag r">OVERDUE</span>':''}${full?' · '+fmtD(m.date):''}<div class="mu">${m.bay?'🟢 Loading Bay Available':'🔴 No Loading Bay Available'}${!m.destNA&&m.dest?' · → '+esc(m.dest):''}${m.notes?' · 📝':''}</div>${full&&m.notes?`<pre>${esc(m.notes)}</pre>`:''}</div><select onchange="setSt('${m.id}',this.value)">${['Upcoming','Arrived','Completed','Cancelled'].map(s=>`<option ${s===m.status?'selected':''}>${s}</option>`).join('')}</select>${full?`<button onclick="mvForm('${m.id}')">Edit</button><button class="d" onclick="del('moves','${m.id}','movement')">Delete</button>`:`<button onclick="mvForm('${m.id}')">Edit</button>`}</div>`}
function setSt(id,s){save('moves',id,{...S.moves.find(x=>x.id===id),status:s})}
/* ---------- views ---------- */
function dash(){const td=today(),te=evs().filter(e=>e.date===td),tt=S.tasks.filter(t=>t.status!=='done').sort(taskSort),dn=S.tasks.filter(t=>t.status==='done'),tm=S.moves.filter(m=>m.date===td&&['Upcoming','Arrived'].includes(m.status)).sort((a,b)=>a.time.localeCompare(b.time));
return `${S.ann?`<div class="ban"><span>${esc(S.ann)}</span><span><button onclick="annForm()">Edit</button> <button class="d" onclick="annDel()">Remove</button></span></div>`:''}
${chg()}<div class="stats mono"><div class="st s1"><i>🎤</i><b>${te.length}</b><span>Events today</span></div><div class="st s2"><i>⚠️</i><b>${te.filter(e=>e.flag).length}</b><span>Flagged today</span></div><div class="st s3"><i>🚚</i><b>${tm.length}</b><span>Movements today</span></div><div class="st s4"><i>📋</i><b>${tt.length}</b><span>Open tasks</span></div><div class="st s5"><i>⏰</i><b>${tt.filter(overdue).length}</b><span>Overdue tasks</span></div></div>
<div class="bar"><button class="p" onclick="evForm()">+ Add Event</button><button class="p" onclick="taskForm()">+ Add Task</button><button class="p" onclick="mvForm()">+ Add Delivery / Collection</button>${S.ann?'':'<button onclick="annForm()">+ Announcement</button>'}<a href="#/print"><button>Print today</button></a></div>
<div class="grid"><div class="card"><h2><span><i>🎤</i>Today's events</span></h2>${te.map(e=>evRow(e)).join('')||'<p class="mu">No events scheduled today.</p>'}</div>
<div class="card"><h2><span><i>⚠️</i>Flagged events today</span></h2>${te.filter(e=>e.flag).map(e=>evRow(e)).join('')||'<p class="mu">No flagged events today.</p>'}</div>
<div class="card"><h2><span><i>🚚</i>Deliveries &amp; collections today</span></h2>${tm.map(m=>mvRow(m)).join('')||'<p class="mu">No equipment deliveries or collections scheduled today.</p>'}</div>
${hoCard()}<div class="card"><h2><span><i>✅</i>Outstanding tasks</span></h2>${tt.map(taskRow).join('')||'<p class="mu">No outstanding tasks.</p>'}<details><summary class="mu">Completed tasks (${dn.length})</summary>${dn.map(taskRow).join('')}</details></div></div>`}
function calView(){const d=cal.d,rooms=[...new Set(S.events.map(e=>e.room))].sort(),ev=day=>evs().filter(e=>e.date===day&&(!cal.room||e.room===cal.room));
const chip=e=>`<a class="ch ${e.flag?'flag':''}" href="#/event/${e.id}">${e.flag?'⚠ ':''}${first(e)!='99:99'?first(e)+' ':''}${esc(e.name)} <span class="mu">${esc(e.room)}</span></a>`;
let title,body;
if(cal.v==='day'){title=fmtD(d);body=ev(d).map(e=>evRow(e)).join('')||'<p class="mu">No events.</p>'}
else if(cal.v==='week'){const s=addD(d,-dow(d));title=fmtD(s)+' – '+fmtD(addD(s,6));body='<div class="wk"><div class="cal">'+[...Array(7)].map((_,i)=>{const x=addD(s,i);return `<div class="${x===today()?'td':''}"><b>${fmtD(x).slice(0,8)}</b>${ev(x).map(chip).join('')}</div>`}).join('')+'</div></div>'}
else{const m=d.slice(0,7),s0=m+'-01',s=addD(s0,-dow(s0));title=new Date(s0+'T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});body='<div class="wk"><div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('')+[...Array(42)].map((_,i)=>{const x=addD(s,i);return `<div class="${x===today()?'td':''}" style="${x.slice(0,7)!==m?'opacity:.5':''}"><a href="#/cal" onclick="cal.v='day';cal.d='${x}'"><b>${+x.slice(8)}</b></a>${ev(x).map(chip).join('')}</div>`}).join('')+'</div></div>'}
return `<div class="bar"><button onclick="calGo(-1)">◀</button><button onclick="cal.d=today();render()">Today</button><button onclick="calGo(1)">▶</button><b>${title}</b>${['day','week','month'].map(v=>`<button class="${cal.v===v?'p':''}" onclick="cal.v='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}<select onchange="cal.room=this.value;render()"><option value="">All rooms</option>${rooms.map(r=>`<option ${r===cal.room?'selected':''}>${esc(r)}</option>`).join('')}</select><button class="p" onclick="evForm(null,cal.d)">+ Add Event</button></div>${body}`}
function calGo(n){const d=cal.d;cal.d=cal.v==='day'?addD(d,n):cal.v==='week'?addD(d,7*n):(()=>{const x=new Date(d.slice(0,7)+'-01T12:00:00Z');x.setUTCMonth(x.getUTCMonth()+n);return x.toISOString().slice(0,10)})();render()}
function evList(){const f=F.ev,td=today(),rooms=[...new Set(S.events.map(e=>e.room))].sort();let l=evs().filter(e=>(!f.room||e.room===f.room)&&(f.f==='all'||(f.f==='today'&&e.date===td)||(f.f==='up'&&e.date>td)||(f.f==='past'&&e.date<td)||(f.f==='flag'&&e.flag))&&(e.name+e.room+e.date+(e.flag?' flagged':'')).toLowerCase().includes(f.q.toLowerCase()));
return `<div class="bar"><input placeholder="Search name, date, room, flagged…" value="${esc(f.q)}" oninput="F.ev.q=this.value;keep(this)"><select onchange="F.ev.f=this.value;render()">${[['all','All'],['today','Today'],['up','Upcoming'],['past','Past'],['flag','Flagged']].map(([v,t])=>`<option value="${v}" ${f.f===v?'selected':''}>${t}</option>`).join('')}</select><select onchange="F.ev.room=this.value;render()"><option value="">All rooms</option>${rooms.map(r=>`<option ${r===f.room?'selected':''}>${esc(r)}</option>`).join('')}</select><button class="p" onclick="evForm()">+ Add Event</button></div>${l.map(e=>evRow(e,1)).join('')||'<p class="mu">No events found.</p>'}`}
function evPage(id){const e=S.events.find(x=>x.id===id);if(!e)return '<p>Event not found. <a href="#/events">Back to events</a></p>';markSeen(e.id,e.rev||0);
return `<div class="card ${e.flag?'flag':''}"><h2><span>${esc(e.name)}</span><span><button onclick="evForm('${id}')">Edit Event</button> <button class="d" onclick="del('events','${id}','event').then(o=>o&&(location.hash='#/events'))">Delete Event</button></span></h2><div>${fmtD(e.date)} · ${esc(e.room)}</div>${e.rev?`<div class="mu">Last changed ${new Date(e.rev).toLocaleString('en-GB',{timeZone:L})}</div>`:''}
${e.flag?`<p><b>${flagTag}</b> ${esc(e.flagReason||'')}</p>`:''}
<h3>Timings</h3>${sortT(e.timings).length||(e.timings||[]).length?(e.manual?e.timings:sortT(e.timings)).map(t=>`<div><b>${t.t}</b> — ${esc(t.a)}</div>`).join(''):'<p class="mu">None added.</p>'}
${(e.staff||[]).length?`<h3>Staff</h3>${e.staff.map(x=>`<div><b>${esc(x.n)}</b>${x.r?' — '+esc(x.r):''}</div>`).join('')}`:''}<h3>Kit list</h3>${e.kit?`<pre>${esc(e.kit)}</pre><button onclick="navigator.clipboard.writeText(S.events.find(x=>x.id==='${id}').kit).then(()=>say('Copied'))">Copy kit list</button>`:'<p class="mu">None added.</p>'}
<h3>Room layout</h3>${e.layout?`<pre>${esc(e.layout)}</pre>`:(e.layoutFiles||[]).length?'':'<p class="mu">None added.</p>'}${(e.layoutFiles||[]).map(a=>a.type.startsWith('image/')?`<p><a href="${a.data}" download="${esc(a.name)}"><img src="${a.data}" style="max-width:100%;border-radius:8px"></a><br><span class="mu">${esc(a.name)}</span></p>`:`<p><a href="${a.data}" download="${esc(a.name)}">📎 ${esc(a.name)}</a></p>`).join('')}
${e.laptop==='req'?`<h3>Laptop control</h3><pre>${esc(e.laptopNote||'Required')}</pre>`:e.laptop==='tbc'?'<h3>Laptop control</h3><p><span class="tag a">NOT YET CONFIRMED</span></p>':''}</div>`}
function tkList(){const f=F.tk,td=today();let l=S.tasks.filter(t=>{const ok={all:1,out:t.status!=='done',done:t.status==='done',od:overdue(t),today:t.date===td,urg:t.pri==='Urgent'&&t.status!=='done'}[f.f];return ok&&(t.title+(t.notes||'')+(t.date||'')+t.pri).toLowerCase().includes(f.q.toLowerCase())}).sort(taskSort);
return `<div class="bar"><input placeholder="Search title, notes, date, priority…" value="${esc(f.q)}" oninput="F.tk.q=this.value;keep(this)"><select onchange="F.tk.f=this.value;render()">${[['out','Outstanding'],['done','Completed'],['od','Overdue'],['today','Due today'],['urg','Urgent'],['all','All']].map(([v,t])=>`<option value="${v}" ${f.f===v?'selected':''}>${t}</option>`).join('')}</select><button class="p" onclick="taskForm()">+ Add Task</button></div>${l.map(taskRow).join('')||'<p class="mu">No tasks found.</p>'}`}
function mvList(){const f=F.mv,td=today();let l=S.moves.filter(m=>(!f.type||m.type===f.type)&&(!f.st||m.status===f.st)&&(f.range==='all'||(f.range==='day'&&m.date===td)||(f.range==='week'&&m.date>=addD(td,-dow(td))&&m.date<=addD(td,6-dow(td)))||(f.range==='month'&&m.date.slice(0,7)===td.slice(0,7)))&&(m.supplier+m.date+m.type+m.status+(m.dest||'')).toLowerCase().includes(f.q.toLowerCase())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const sel=(k,o)=>`<select onchange="F.mv.${k}=this.value;render()">${o.map(([v,t])=>`<option value="${v}" ${f[k]===v?'selected':''}>${t}</option>`).join('')}</select>`;
return `<div class="bar"><input placeholder="Search supplier, date, destination…" value="${esc(f.q)}" oninput="F.mv.q=this.value;keep(this)">${sel('range',[['all','All dates'],['day','Today'],['week','This week'],['month','This month']])}${sel('type',[['','Both types'],['Delivery','Deliveries'],['Collection','Collections']])}${sel('st',[['','Any status'],['Upcoming','Upcoming'],['Arrived','Arrived'],['Completed','Completed'],['Cancelled','Cancelled']])}<button class="p" onclick="mvForm()">+ Add Delivery / Collection</button></div>${l.map(m=>mvRow(m,1)).join('')||'<p class="mu">No movements found.</p>'}`}
let kt;function keep(el){clearTimeout(kt);kt=setTimeout(()=>{const p=el.selectionStart;render();const n=document.querySelector('.bar input');if(n){n.focus();n.setSelectionRange(p,p)}},250)}
/* ---------- forms ---------- */
function modal(h,onSub){$('#modal').innerHTML=`<div class="ov"><div class="md"><form id="f">${h}<p class="err" id="er"></p><button class="p" type="submit">Save</button> <button type="button" onclick="closeM()">Cancel</button></form></div></div>`;$('#f').onsubmit=async e=>{e.preventDefault();const r=await onSub(new FormData(e.target));if(r)closeM()}}
const closeM=()=>$('#modal').innerHTML='',fail=m=>{$('#er').textContent=m;return false};
const fld=(n,l,v='',t='text',x='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}>`,ta=(n,l,v='',r=4)=>`<label>${l}</label><textarea name="${n}" rows="${r}">${esc(v)}</textarea>`;
function annForm(){modal(`<h2>Announcement</h2>${ta('a','Message',S.ann,4)}`,async f=>{const a=f.get('a').trim();if(!a)return fail('Enter a message, or use Remove.');await save('config','announcement',{text:a});return true})}
async function annDel(){if(await ask('Remove the announcement?','Remove')){try{await col('config').doc('announcement').delete();say('Removed')}catch(e){say('Remove failed: '+(e.message||e.code))}}}
function tsRow(t='',a=''){return `<div class="ts"><input type="time" value="${t}" required><input value="${esc(a)}" placeholder="Activity" required><button type="button" onclick="mv(this,-1)">↑</button><button type="button" onclick="mv(this,1)">↓</button><button type="button" class="d" onclick="this.parentNode.remove()">✕</button></div>`}
function mv(b,d){const r=b.parentNode,s=d<0?r.previousElementSibling:r.nextElementSibling;if(!s)return;d<0?s.before(r):s.after(r)}
function evForm(id,date){const e=S.events.find(x=>x.id===id)||{date:date||today(),timings:[],laptop:'na'},rooms=[...new Set(S.events.map(x=>x.room))];
modal(`<h2>${id?'Edit':'Add'} event</h2>${fld('name','Event name *',e.name)}${fld('date','Date *',e.date,'date','required')}${id?'':`<label>Repeat</label><select name="repeat"><option value="">Does not repeat</option><option value="w">Weekly</option><option value="f">Fortnightly</option></select><label>Repeat until</label><input type="date" name="until">`}<label>Room / location *</label><input name="room" list="rl" value="${esc(e.room)}"><datalist id="rl">${[...new Set([...ROOMS,...rooms])].sort().map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
<label>Timings &amp; activities</label><div id="ts">${(e.timings||[]).map(t=>tsRow(t.t,t.a)).join('')}</div><button type="button" onclick="$('#ts').insertAdjacentHTML('beforeend',tsRow())">+ Add Timing</button> <button type="button" onclick="sortTs()">Sort by time</button>
<label>Kit template</label><select onchange="tplPick(this)"><option value="">Choose a template…</option>${[...TPL,...S.tpl].map(t=>`<option>${esc(t.name)}</option>`).join('')}</select>${ta('kit','Kit list',e.kit,5)}<div class="ts"><input name="tplname" placeholder="Template name" style="width:auto;flex:1"><button type="button" onclick="tplSave()">Save kit as template</button></div>${ta('layout','Room layout',e.layout,3)}<label>Layout attachments (images or PDF, max 700 KB each)</label><input type="file" name="lf" multiple accept="image/*,.pdf">${(e.layoutFiles||[]).map((a,i)=>`<label class="i"><input type="checkbox" name="rm" value="${i}"> Remove ${esc(a.name)}</label>`).join('')}<label>Laptop control</label><select name="laptop"><option value="na" ${e.laptop==='na'?'selected':''}>Not Required / N/A</option><option value="req" ${e.laptop==='req'?'selected':''}>Required</option><option value="tbc" ${e.laptop==='tbc'?'selected':''}>Not Yet Confirmed</option></select>${ta('laptopNote','Laptop instructions (if required)',e.laptopNote,2)}
<label>Staff on this event</label><datalist id="sn">${STAFF.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="sr">${ROLES.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div id="sf">${(e.staff||[]).map(x=>stRow(x.n,x.r)).join('')}</div><button type="button" onclick="$('#sf').insertAdjacentHTML('beforeend',stRow())">+ Add Staff</button>
<label class="i"><input type="checkbox" name="flag" ${e.flag?'checked':''}> Flag this event — non-standard equipment or special technical requirements.</label>${ta('flagReason','Flag reason',e.flagReason,2)}`,async f=>{
const name=f.get('name').trim(),room=f.get('room').trim();if(!name||!room)return fail('Event name and room are required.');
const timings=[...document.querySelectorAll('#ts .ts')].map(r=>({t:r.children[0].value,a:r.children[1].value.trim()}));if(timings.some(t=>!/^\d\d:\d\d$/.test(t.t)||!t.a))return fail('Each timing needs a time (HH:MM) and an activity.');
const fl=[...document.querySelector('[name=lf]').files];if(fl.some(x=>x.size>7e5))return fail('Each attachment must be under 700 KB.');const rm=f.getAll('rm').map(Number);const files=[...(e.layoutFiles||[]).filter((_,i)=>!rm.includes(i)),...await Promise.all(fl.map(rd))];const staff=[...document.querySelectorAll('#sf .ts')].map(r=>({n:r.children[0].value.trim(),r:r.children[1].value.trim()})).filter(x=>x.n);const nid=id||uid();const rec={id:nid,name,layoutFiles:files,staff,date:f.get('date'),room,timings,manual:true,kit:f.get('kit'),layout:f.get('layout'),laptop:f.get('laptop'),laptopNote:f.get('laptopNote'),flag:!!f.get('flag'),flagReason:f.get('flagReason')};return saveEv(rec,id,f.get('repeat'),f.get('until'),e.rev)})}
function sortTs(){const c=$('#ts'),r=[...c.children].sort((a,b)=>a.children[0].value.localeCompare(b.children[0].value));r.forEach(x=>c.append(x))}
function taskForm(id){const t=S.tasks.find(x=>x.id===id)||{pri:'Normal',status:'out'};modal(`<h2>${id?'Edit':'Add'} task</h2>${fld('title','Title *',t.title)}${ta('notes','Notes',t.notes,3)}${fld('date','Due date',t.date,'date')}${fld('time','Due time',t.time,'time')}<label>Priority</label><select name="pri">${['Normal','Important','Urgent'].map(p=>`<option ${p===t.pri?'selected':''}>${p}</option>`).join('')}</select>`,async f=>{const title=f.get('title').trim();if(!title)return fail('Task title is required.');if(f.get('time')&&!f.get('date'))return fail('Add a due date to go with the due time.');const nid=id||uid();return save('tasks',nid,{id:nid,title,notes:f.get('notes'),date:f.get('date'),time:f.get('time'),pri:f.get('pri'),status:t.status},undefined,t.rev)})}
function mvForm(id){const m=S.moves.find(x=>x.id===id)||{date:today(),type:'Delivery',bay:false,status:'Upcoming'},sup=[...new Set(S.moves.map(x=>x.supplier))];modal(`<h2>${id?'Edit':'Add'} delivery / collection</h2><label>Supplier *</label><input name="supplier" list="sl" value="${esc(m.supplier)}"><datalist id="sl">${sup.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><label>Type *</label><select name="type"><option ${m.type==='Delivery'?'selected':''}>Delivery</option><option ${m.type==='Collection'?'selected':''}>Collection</option></select>${fld('date','Date *',m.date,'date','required')}${fld('time','Scheduled time *',m.time,'time','required')}
<label class="i"><input type="checkbox" name="bay" ${m.bay?'checked':''}> Loading Bay Available</label>${fld('dest','Equipment Destination',m.dest)}<label class="i"><input type="checkbox" name="destNA" ${m.destNA?'checked':''}> Destination N/A</label>${ta('notes','Additional notes',m.notes,3)}<label>Status</label><select name="status">${['Upcoming','Arrived','Completed','Cancelled'].map(s=>`<option ${s===m.status?'selected':''}>${s}</option>`).join('')}</select>`,async f=>{const supplier=f.get('supplier').trim();if(!supplier||!f.get('date')||!f.get('time'))return fail('Supplier, date and time are required.');const nid=id||uid();return save('moves',nid,{id:nid,supplier,type:f.get('type'),date:f.get('date'),time:f.get('time'),bay:!!f.get('bay'),dest:f.get('dest'),destNA:!!f.get('destNA'),notes:f.get('notes'),status:f.get('status')},undefined,m.rev)})}
/* ---------- router ---------- */
const tabs=[['','Dashboard'],['cal','Calendar'],['events','Events'],['tasks','Tasks'],['moves','Equipment Movements'],['history','History']];
function render(){document.title=(NU()?'('+NU()+') ':'')+'UVB Tech Team Hub';const h=location.hash.replace('#/','').split('/'),r=h[0];$('#nav').innerHTML=tabs.map(([k,t])=>`<a href="#/${k}" class="${(r||'')===k||(r==='event'&&k==='events')?'on':''}">${t}${k==='events'&&NU()?` <span class="tag a">${NU()}</span>`:''}</a>`).join('');
const a=document.activeElement;if(a&&a.closest&&a.closest('#modal'))return;
$('#app').innerHTML=!db?'<p>Database not connected — check the Firebase config and rules.</p>':r==='cal'?calView():r==='events'?evList():r==='event'?evPage(h[1]):r==='tasks'?tkList():r==='moves'?mvList():r==='history'?histView():r==='print'?printView():dash()}
addEventListener('hashchange',render);render();$('#who').value=me;
(async()=>{try{const u=await authGate();if(!me){me=(u.displayName||u.email||'').split('@')[0];$('#who').value=me}db=fbAdapter()}catch(e){console.error(e)}if(!db){render();return}
const sub=(n,k)=>col(n).onSnapshot(s=>{S[k]=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>say('Sync error: '+e.message));
sub('events','events');sub('tasks','tasks');sub('moves','moves');sub('history','hist');sub('handover','handover');sub('templates','tpl');
col('config').onSnapshot(s=>{const d=s.docs.find(x=>x.id==='announcement');S.ann=d?(d.data().text||''):'';render()})})();
</script></body></html>
